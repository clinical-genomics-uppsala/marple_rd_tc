# ---------------------------------------------------------------------------
#  Gemensam config (Marvin och Miarka).
#
#  Kors tillsammans med en referensfil och en site-config:
#    --configfile config/config.yaml \
#                 config/reference_files/reference_files_<site>.yaml \
#                 config/site_configs/site_config_<site>.yaml \
#                 config/config_exomedepth.yaml     (kopia av config_exomedepth_<miseq|novaseqX>.yaml)
#  {{ref_*}} loses ur reference_files_<site>.yaml; resources, output,
#  {{CONTAINER_DIR}} och hydra_local_path ur site_config_<site>.yaml.
# ---------------------------------------------------------------------------

---
samples: "samples.tsv"
units: "units.tsv"

default_container: "{{CONTAINER_DIR}}/hydragenetics__common_3.1.1.sif"

modules:
  alignment: "v0.7.0"
  annotation: "v1.2.0"
  cnv_sv: "v3.2.1"
  compression: "v2.1.0"
  filtering: "v1.1.0"
  prealignment: "v1.4.0"
  qc: "v0.6.0"
  snv_indels: "v2.0.0"

reference:
  annovar: "{{ref_2025feb18}}"
  fasta: "{{ref_homo_sapiens_fasta}}"
  fai: "{{ref_homo_sapiens_fasta_fai}}"
  sites: "{{ref_homo_sapiens_known_indels_vcf_gz}}" #Needed?
  design_bed: "{{ref_twist_cancer_230608_hg38_te_98982205_wpgrs_merged_bed}}"
  design_intervals: "{{ref_twist_cancer_230608_hg38_te_98982205_wpgrs_merged_intervals}}"
  exon_bed: "{{ref_twist_cancer_230602_hg38_coding_exons_bed}}"
  exon_intervals: "{{ref_twist_cancer_230602_hg38_coding_exons_intervals}}"
  pgrs_bed: "{{ref_twist_cancer_230707_hg38_pgrs_snps_bed}}"
  skip_chrs:
    - "chrX"
    - "chrY"
    - "chrM"

trimmer_software: fastp_pe

bcftools_view_deepsomatic:
  extra: "--exclude 'QUAL<1 | FORMAT/DP<10 | FORMAT/GQ<2 | FORMAT/VAF>0.4 && FORMAT/VAF<0.6 | FORMAT/VAF<0.01 | FORMAT/VAF>0.99' " # remove gnomad of some AF threshold? -T ^/projects/wp3/nobackup/Workspace/mosaic/hardregNgnomad_hg38.bed

bwa_mem:
  container: "{{CONTAINER_DIR}}/hydragenetics__bwa_mem_0.7.17.sif"
  amb: "{{ref_homo_sapiens_fasta_amb}}"
  ann: "{{ref_homo_sapiens_fasta_ann}}"
  bwt: "{{ref_homo_sapiens_fasta_bwt}}"
  pac: "{{ref_homo_sapiens_fasta_pac}}"
  sa: "{{ref_homo_sapiens_fasta_sa}}"

deepmosaic_draw:
  container: "{{CONTAINER_DIR}}/sanglee8888__deepmosaic__deepmosaic_sha256-28b3dd3b3ab1.sif"

deepmosaic_predict:
  container: "{{CONTAINER_DIR}}/sanglee8888__deepmosaic__deepmosaic_sha256-28b3dd3b3ab1.sif"

deepvariant:
  container: "{{CONTAINER_DIR}}/hydragenetics__deepvariant_1.4.0.sif"
  model_type: "WES"
  output_gvcf: True

deepsomatic_t_only:
  container: "{{CONTAINER_DIR}}/google__deepsomatic_1.8.0.sif"
  extra: "--use_default_pon_filtering=true make_examples_extra_args='vsc_min_fraction_snps=0.029,vsc_min_fraction_indels=0.05' " #--use_default_pon_filtering=true or --pon_filtering="pon.vcf" --process_somatic=true or ""
  model: "WGS_TUMOR_ONLY" # WGS,WES,PACBIO,ONT,FFPE_WGS,FFPE_WES,WGS_TUMOR_ONLY,PACBIO_TUMOR_ONLY,ONT_TUMOR_ONLY

exomedepth_call:
  container: "{{CONTAINER_DIR}}/hydragenetics__exomedepth_1.1.15.sif"
  bedfile: "{{ref_twist_cancer_230706_hg38_te_98982205_wpgrs_merged_200bpwindows_bed}}"
  exonsfile: "{{ref_exons_grch38_ensembl109_txt}}"
  genesfile: "{{ref_genes_grch38_ensembl109_txt}}"
  genome_version: "hg38"

exomedepth_export:
  container: "{{CONTAINER_DIR}}/hydragenetics__exomedepth_1.1.15.sif"

export_qc_bedtools_intersect:
  extra: " -wb "

export_qc_xlsx_report:
  wanted_transcripts: "{{ref_wanted_transcripts_txt}}"

fastp_pe:
  container: "{{CONTAINER_DIR}}/hydragenetics__fastp_0.20.1.sif"

fastqc:
  container: "{{CONTAINER_DIR}}/hydragenetics__fastqc_0.11.9.sif"

melt:
  container: "{{CONTAINER_DIR}}/MELT_v2.2.2.sif"
  bed: "{{ref_hg38_genes_bed}}"
  extra: "-r 150 -exome"
  mei: "{{ref_mei_list_txt}}"

bcftools_hardfilter_exomedepth:
  exclude: "'BF<=0'"

bcftools_softfilter_melt:
  exclude: "'FILTER~\"ac0\" '"
  extra: "-s LowQual"

bcftools_softfilter_scramble:
  exclude: "'INFO/Clipped_Reads_In_Cluster<5 || INFO/Alignment_Score<60 || INFO/Alignment_Percent_Length<90 || INFO/Alignment_Percent_Identity<90'"
  extra: "-s LowQual"

bcftools_view_svdb:
  extra: "-e 'FILTER~\"LowQual\"'"

samtools_merge_bam:
  extra: "-c -p"

scramble_cluster_identifier:
  container: "{{CONTAINER_DIR}}/hydragenetics__scramble_1.0.2.sif"

scramble_cluster_analysis:
  container: "{{CONTAINER_DIR}}/hydragenetics__scramble_1.0.2.sif"
  install_dir: "/opt/scramble/cluster_analysis/bin"
  mei_refs: "/opt/scramble/cluster_analysis/resources/MEI_consensus_seqs.fa"

svdb_merge:
  container: "{{CONTAINER_DIR}}/hydragenetics__svdb_2.10.2.sif"
  overlap: 0.6
  priority: "exomedepth,melt,scramble"
  extra: "--pass_only --no_intra"

mosaicforecast_input:
  bcftools_filter: "--exclude 'FILTER!=\"PASS\" || FORMAT/DP<8'"

mosaicforecast_phasing:
  container: "{{CONTAINER_DIR}}/yanmei__mosaicforecast_hg38_0.0.1.sif"
  f_format: "bam" # cram/bam
  umap: "/usr/local/bin/k24.umap.wg.bw"

mosaicforecast_readlevel:
  container: "{{CONTAINER_DIR}}/yanmei__mosaicforecast_hg38_0.0.1.sif"
  f_format: "bam" # cram/bam
  umap: "/usr/local/bin/k24.umap.wg.bw"

mosaicforecast_genotype_prediction:
  container: "{{CONTAINER_DIR}}/yanmei__mosaicforecast_hg38_0.0.1.sif"
  model_trained_SNP: "{{ref_150xrfmodel_addrmsk_refine_rds}}" # 200xRFmodel_addRMSK_Refine.rds or deletions_250x.RF.rds(phase) or insertions_250x.RF.rds(phase)
  model_trained_INS: "{{ref_insertions_250x_rf_rds}}" # 200xRFmodel_addRMSK_Refine.rds or deletions_250x.RF.rds(phase) or insertions_250x.RF.rds(phase)
  model_trained_DEL: "{{ref_deletions_250x_rf_rds}}" # 200xRFmodel_addRMSK_Refine.rds or deletions_250x.RF.rds(phase) or insertions_250x.RF.rds(phase)
  model_type_SNP: "Refine"  # phase/refine
  model_type_INS: "Phase"  # phase/refine
  model_type_DEL: "Phase"  # phase/refine
        
mosdepth_bed:
  container: "{{CONTAINER_DIR}}/hydragenetics__mosdepth_0.3.2.sif"
  thresholds: "10,20,50"

multiqc:
  container: "{{CONTAINER_DIR}}/hydragenetics__multiqc_1.11.sif"
  reports:
    DNA:
      included_unit_types: ["T", "N"]
      config: "config/multiqc_config.yaml"
      qc_files:
        - "prealignment/fastp_pe/{sample}_{type}_{flowcell}_{lane}_{barcode}_fastp.json"
        - "qc/fastqc/{sample}_{type}_{flowcell}_{lane}_{barcode}_{read}_fastqc.zip"
        - "qc/picard_collect_alignment_summary_metrics/{sample}_{type}.alignment_summary_metrics.txt"
        - "qc/picard_collect_duplication_metrics/{sample}_{type}.duplication_metrics.txt"
        - "qc/picard_collect_gc_bias_metrics/{sample}_{type}.gc_bias.summary_metrics"
        - "qc/picard_collect_hs_metrics/{sample}_{type}.HsMetrics.txt"
        - "qc/picard_collect_insert_size_metrics/{sample}_{type}.insert_size_metrics.txt"
        - "qc/picard_collect_multiple_metrics/{sample}_{type}.{ext}"
        - "qc/samtools_stats/{sample}_{type}.samtools-stats.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.summary.txt"
        - "qc/mosdepth_bed/{sample}_{type}.per-base.bed.gz"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.region.dist.txt"
        - "qc/mosdepth_bed/{sample}_{type}.mosdepth.global.dist.txt"

picard_collect_alignment_summary_metrics:
  container: "{{CONTAINER_DIR}}/hydragenetics__picard_2.25.4.sif"

picard_collect_duplication_metrics:
  container: "{{CONTAINER_DIR}}/hydragenetics__picard_2.25.4.sif"

picard_collect_gc_bias_metrics:
  container: "{{CONTAINER_DIR}}/hydragenetics__picard_2.25.4.sif"

picard_collect_hs_metrics:
  container: "{{CONTAINER_DIR}}/hydragenetics__picard_2.25.4.sif"

picard_collect_insert_size_metrics:
  container: "{{CONTAINER_DIR}}/hydragenetics__picard_2.25.4.sif"

picard_collect_multiple_metrics:
  container: "{{CONTAINER_DIR}}/hydragenetics__picard_2.25.4.sif"
  output_ext:
    - "gc_bias.pdf" #collect_gc_bias
    - "gc_bias.summary_metrics"
    - "gc_bias.detail_metrics"
    - "alignment_summary_metrics" # collect_alignment_summary
    - "insert_size_metrics" # collect_insert_size
    - "insert_size_histogram.pdf"
    - "error_summary_metrics" # collect_sequencing_artefact
    - "bait_bias_detail_metrics"
    - "bait_bias_summary_metrics"
    - "pre_adapter_detail_metrics"
    - "pre_adapter_summary_metrics"
    - "quality_distribution_metrics" # quality_score_distribution
    - "quality_distribution.pdf"
    - "quality_yield_metrics" # quality yield metrics

picard_mark_duplicates:
  container: "{{CONTAINER_DIR}}/hydragenetics__picard_2.25.4.sif"

vep:
  container: "{{CONTAINER_DIR}}/ensemblorg__ensembl-vep_release_110.1.sif"
  vep_cache: "{{ref_vep}}"
  extra: "--assembly GRCh38 --check_existing --pick --variant_class --everything"

vt_decompose:
  container: "{{CONTAINER_DIR}}/hydragenetics__vt_2015.11.10.sif"

vt_normalize:
  container: "{{CONTAINER_DIR}}/hydragenetics__vt_2015.11.10.sif"
